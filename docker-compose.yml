services:
  server:
    build: .
    command: uvicorn server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 5s
      timeout: 3s
      retries: 3

  client:
    build: .
    command: python client.py
    depends_on:
      - server
    ports:
      - "9000:9000"
